<svg width="560" height="300" viewBox="0 0 560 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tazkertak featured card</title>
  <desc id="desc">A premium dark product card for Tazkertak.</desc>
  <defs>
    <linearGradient id="taz-bg" x1="0" y1="0" x2="560" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="1" stop-color="#121B2D"/>
    </linearGradient>
    <linearGradient id="taz-stroke" x1="32" y1="24" x2="520" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(45,212,191,0.55)"/>
      <stop offset="1" stop-color="rgba(96,165,250,0.25)"/>
    </linearGradient>
    <radialGradient id="taz-orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(440 78) rotate(90) scale(110 110)">
      <stop stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="taz-logo-clip">
      <rect x="384" y="146" width="108" height="108" rx="30"/>
    </clipPath>
  </defs>

  <rect width="560" height="300" rx="28" fill="url(#taz-bg)"/>
  <rect x="14" y="14" width="532" height="272" rx="22" stroke="rgba(148,163,184,0.14)"/>
  <rect x="24" y="24" width="512" height="252" rx="18" stroke="url(#taz-stroke)" stroke-opacity="0.28"/>

  <g opacity="0.14">
    <path d="M32 82H528" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M32 150H528" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M32 218H528" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M136 24V276" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M248 24V276" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M360 24V276" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M472 24V276" stroke="#64748B" stroke-dasharray="4 8"/>
  </g>

  <circle cx="440" cy="78" r="110" fill="url(#taz-orb)">
    <animate attributeName="cx" values="440;455;440" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="78;88;78" dur="10s" repeatCount="indefinite"/>
  </circle>

  <text x="40" y="54" fill="#5EEAD4" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" letter-spacing="0.18em">
    FEATURED PRODUCT
  </text>

  <text x="40" y="98" fill="#F8FAFC" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="34" font-weight="700">
    Tazkertak
  </text>

  <text x="40" y="130" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">
    private relationship app • trust-sensitive UX
  </text>

  <text x="40" y="172" fill="#E2E8F0" font-family="Inter, Arial, sans-serif" font-size="16">
    Secure pairing, shared memories, pulse interactions,
  </text>
  <text x="40" y="196" fill="#E2E8F0" font-family="Inter, Arial, sans-serif" font-size="16">
    and native widgets shaped into a cohesive emotional product.
  </text>

  <g>
    <rect x="40" y="226" width="116" height="30" rx="15" fill="rgba(20,184,166,0.14)" stroke="rgba(45,212,191,0.22)"/>
    <text x="58" y="246" fill="#CCFBF1" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Product feel</text>
  </g>
  <g>
    <rect x="166" y="226" width="100" height="30" rx="15" fill="rgba(37,99,235,0.14)" stroke="rgba(96,165,250,0.22)"/>
    <text x="184" y="246" fill="#DBEAFE" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Mobile UX</text>
  </g>
  <g>
    <rect x="276" y="226" width="112" height="30" rx="15" fill="rgba(17,24,39,0.7)" stroke="rgba(148,163,184,0.18)"/>
    <text x="294" y="246" fill="#E5E7EB" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Widgets</text>
  </g>

  <rect x="384" y="146" width="108" height="108" rx="30" fill="rgba(15,23,42,0.9)" stroke="rgba(96,165,250,0.2)"/>
  <image href="data:image/png;base64," x="384" y="146" width="108" height="108" clip-path="url(#taz-logo-clip)" preserveAspectRatio="xMidYMid slice"/>
</svg>
