<svg width="560" height="320" viewBox="0 0 560 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tazkertak featured project card</title>
  <desc id="desc">Premium project card for Tazkertak highlighting secure pairing, memories, and native widgets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="560" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="245" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430 74) rotate(90) scale(92 92)">
      <stop stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tazLogoClip">
      <rect x="-27" y="-27" width="54" height="54" rx="18"/>
    </clipPath>
  </defs>

  <rect width="560" height="320" rx="26" fill="url(#bg)"/>
  <rect x="12" y="12" width="536" height="296" rx="20" stroke="rgba(148,163,184,0.16)"/>

  <g opacity="0.18">
    <path d="M0 72H560" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M0 140H560" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M0 208H560" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M124 0V320" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M248 0V320" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M372 0V320" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M496 0V320" stroke="#64748B" stroke-dasharray="4 8"/>
  </g>

  <circle cx="430" cy="74" r="92" fill="url(#orb)">
    <animate attributeName="cx" values="430;450;430" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="74;84;74" dur="9s" repeatCount="indefinite"/>
  </circle>

  <rect x="40" y="42" width="82" height="8" rx="4" fill="url(#accent)"/>
  <text x="40" y="92" fill="#F8FAFC" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="34" font-weight="700">
    Tazkertak
  </text>
  <text x="40" y="124" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">
    relationship product • private moments • trust-sensitive UX
  </text>

  <text x="40" y="172" fill="#E2E8F0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500">
    Secure pairing, shared memories, pulse interactions,
  </text>
  <text x="40" y="196" fill="#E2E8F0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500">
    and native widgets shaped into a cohesive emotional product.
  </text>

  <g>
    <rect x="40" y="236" width="150" height="34" rx="17" fill="rgba(20,184,166,0.16)" stroke="rgba(45,212,191,0.24)"/>
    <text x="59" y="258" fill="#CCFBF1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">
      Product sensitivity
    </text>
  </g>

  <g>
    <rect x="202" y="236" width="112" height="34" rx="17" fill="rgba(37,99,235,0.14)" stroke="rgba(96,165,250,0.22)"/>
    <text x="222" y="258" fill="#DBEAFE" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">
      Mobile UX
    </text>
  </g>

  <g>
    <rect x="326" y="236" width="132" height="34" rx="17" fill="rgba(17,24,39,0.7)" stroke="rgba(148,163,184,0.18)"/>
    <text x="346" y="258" fill="#E5E7EB" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">
      Native widgets
    </text>
  </g>

  <g transform="translate(430 168)">
    <rect x="-34" y="-34" width="68" height="68" rx="22" fill="rgba(15,23,42,0.88)" stroke="rgba(96,165,250,0.18)"/>
    <image href="data:image/png;base64," x="-27" y="-27" width="54" height="54" clip-path="url(#tazLogoClip)" preserveAspectRatio="xMidYMid slice"/>
  </g>
</svg>
