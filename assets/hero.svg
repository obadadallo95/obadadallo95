<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Obada Dallo - AI-first product builder</title>
  <desc id="desc">Premium animated profile banner for Obada Dallo highlighting product building, bilingual execution, and systems thinking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.55" stop-color="#0D1728"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="170" y1="0" x2="970" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#14B8A6"/>
      <stop offset="0.7" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="orbA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(90) scale(120 120)">
      <stop stop-color="#14B8A6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(90) scale(150 150)">
      <stop stop-color="#2563EB" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="380" rx="22" stroke="rgba(148,163,184,0.18)"/>

  <g opacity="0.17">
    <path d="M0 92H1200" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M0 164H1200" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M0 236H1200" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M0 308H1200" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M180 0V420" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M360 0V420" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M540 0V420" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M720 0V420" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M900 0V420" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M1080 0V420" stroke="#64748B" stroke-dasharray="4 8"/>
  </g>

  <g opacity="0.95">
    <circle cx="950" cy="120" r="120" fill="url(#orbA)">
      <animate attributeName="cx" values="950;980;950" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;110;120" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="250" r="150" fill="url(#orbB)">
      <animate attributeName="cx" values="1040;1010;1040" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;265;250" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g filter="url(#softGlow)">
    <rect x="70" y="66" width="120" height="8" rx="4" fill="url(#glow)"/>
  </g>

  <text x="70" y="128" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-1.5">
    Obada Dallo
  </text>

  <text x="70" y="170" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">
    AI-first product builder • founder-minded • systems thinker
  </text>

  <text x="70" y="218" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500">
    I turn raw ideas into launchable digital products across web, mobile,
  </text>
  <text x="70" y="248" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500">
    automation, and AI-assisted workflows — with sharp scope and real execution.
  </text>

  <g>
    <rect x="70" y="296" width="184" height="40" rx="20" fill="rgba(15,118,110,0.18)" stroke="rgba(45,212,191,0.32)"/>
    <text x="90" y="321" fill="#CCFBF1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">
      Arabic + English
    </text>
  </g>

  <g>
    <rect x="268" y="296" width="156" height="40" rx="20" fill="rgba(30,41,59,0.78)" stroke="rgba(96,165,250,0.26)"/>
    <text x="288" y="321" fill="#DBEAFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">
      MVP delivery
    </text>
  </g>

  <g>
    <rect x="438" y="296" width="176" height="40" rx="20" fill="rgba(30,41,59,0.78)" stroke="rgba(74,222,128,0.24)"/>
    <text x="458" y="321" fill="#DCFCE7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">
      Civic products
    </text>
  </g>

  <g transform="translate(915 220)">
    <circle cx="90" cy="0" r="76" fill="none" stroke="rgba(148,163,184,0.18)" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle cx="90" cy="0" r="52" fill="none" stroke="rgba(20,184,166,0.18)" stroke-width="1.5"/>
    <circle cx="90" cy="0" r="28" fill="none" stroke="rgba(96,165,250,0.22)" stroke-width="1.5"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 90 0" to="360 90 0" dur="16s" repeatCount="indefinite"/>
      <circle cx="166" cy="0" r="5" fill="#5EEAD4"/>
      <circle cx="90" cy="-52" r="4" fill="#60A5FA"/>
      <circle cx="48" cy="42" r="3.5" fill="#22C55E"/>
    </g>

    <g opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="360 90 0" to="0 90 0" dur="12s" repeatCount="indefinite"/>
      <path d="M90 -76 L90 -52" stroke="rgba(148,163,184,0.6)" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M166 0 L142 0" stroke="rgba(148,163,184,0.6)" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M48 42 L66 28" stroke="rgba(148,163,184,0.6)" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <text x="90" y="-96" text-anchor="middle" fill="#94A3B8" font-family="IBM Plex Mono, Menlo, monospace" font-size="13">
      idea
    </text>
    <text x="182" y="4" text-anchor="middle" fill="#94A3B8" font-family="IBM Plex Mono, Menlo, monospace" font-size="13">
      build
    </text>
    <text x="90" y="104" text-anchor="middle" fill="#94A3B8" font-family="IBM Plex Mono, Menlo, monospace" font-size="13">
      launch
    </text>
    <text x="-2" y="4" text-anchor="middle" fill="#94A3B8" font-family="IBM Plex Mono, Menlo, monospace" font-size="13">
      scope
    </text>
  </g>
</svg>
