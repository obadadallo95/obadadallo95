<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Obada Dallo - AI-first product builder</title>
  <desc id="desc">Premium animated profile banner for Obada Dallo highlighting product building, bilingual execution, and systems thinking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.55" stop-color="#0D1728"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="170" y1="0" x2="970" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#14B8A6"/>
      <stop offset="0.7" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="380" rx="22" stroke="rgba(148,163,184,0.18)"/>

  <g opacity="0.17">
    <path d="M0 92H1200" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M0 164H1200" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M0 236H1200" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M0 308H1200" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M180 0V420" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M360 0V420" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M540 0V420" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M720 0V420" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M900 0V420" stroke="#64748B" stroke-dasharray="4 8"/>
    <path d="M1080 0V420" stroke="#64748B" stroke-dasharray="4 8"/>
  </g>

  <circle cx="970" cy="115" r="120" fill="#14B8A6" opacity="0.05"/>
  <circle cx="1030" cy="250" r="150" fill="#2563EB" opacity="0.07"/>

  <g filter="url(#softGlow)">
    <rect x="70" y="66" width="120" height="8" rx="4" fill="url(#glow)"/>
  </g>

  <text x="70" y="128" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-1.5">
    Obada Dallo
  </text>

  <text x="70" y="170" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">
    AI-first product builder • founder-minded • systems thinker
  </text>

  <text x="70" y="222" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500">
    I turn raw ideas into launchable digital products across web, mobile,
  </text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500">
    automation, and AI-assisted workflows — with sharp scope and real execution.
  </text>

  <g>
    <rect x="70" y="302" width="248" height="42" rx="21" fill="rgba(15,118,110,0.18)" stroke="rgba(45,212,191,0.32)"/>
    <text x="92" y="329" fill="#CCFBF1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
      Arabic + English product execution
    </text>
  </g>

  <g>
    <rect x="332" y="302" width="187" height="42" rx="21" fill="rgba(30,41,59,0.78)" stroke="rgba(96,165,250,0.26)"/>
    <text x="354" y="329" fill="#DBEAFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
      MVP-first delivery
    </text>
  </g>

  <g>
    <rect x="533" y="302" width="200" height="42" rx="21" fill="rgba(30,41,59,0.78)" stroke="rgba(74,222,128,0.24)"/>
    <text x="555" y="329" fill="#DCFCE7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
      Civic + product thinking
    </text>
  </g>

  <g opacity="0.85">
    <path d="M835 330H1045" stroke="url(#line)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 210;210 0;0 210" dur="5.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-30;-240" dur="5.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="1048" cy="330" r="4" fill="#5EEAD4">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="835" y="288" fill="#94A3B8" font-family="IBM Plex Mono, Menlo, monospace" font-size="16">
    product thinking → scope → build → launch
  </text>
</svg>
